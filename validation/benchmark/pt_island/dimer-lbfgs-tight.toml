# optbench's rgsaddle/saddle-dimer-lbfgs with rotation_tol 1e-6, which
# turns the torque window off: the dimer rotates toward that tolerance,
# up to max_rotations, at every step.
id = "rgsaddle/saddle-dimer-lbfgs-tight"
engine = "rgsaddle"
problem = "saddle-search/pt-island"
code = "rgsaddle"
algorithm = "Dimer L-BFGS"
tuning = "default"

[ini.Main]
job = "saddle_search"
session = "minmode"

[ini.Optimizer]
opt_method = "lbfgs"
convergence_metric = "norm"
converged_force = 0.001
max_move = 0.2
max_iterations = 1000

[ini.SaddleSearch]
min_mode_method = "dimer"
max_iterations = 1000
dr = 0.001
rotation_tol = 1e-6
max_rotations = 20
krylov_dim = 12
rotation_angle_tol = 0.0
difference = "forward"
mode_seed = "file"

[ini.Search]
repetitions = 1
displace_atoms = "0,1,2,3,4,5,6"
displace_magnitude = 0.1
displace_radius = 3.3
max_searches = 20000
