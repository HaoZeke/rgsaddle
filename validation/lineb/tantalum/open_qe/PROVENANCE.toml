[paper]
doi = "10.1063/1.5007180"
section = "III B"
paper_code = "VASP"
paper_xc = "PW91"
paper_pp = "PAW (licensed potpaw_GGA; TITEL only in reconstructed/POTCAR.TITEL)"
paper_encut_eV = 250.0

[open_backend]
code = "Quantum ESPRESSO"
binary = "pw.x"
xc = "PW91"
pp_type = "ultrasoft Vanderbilt (USPP), UPF v2"
pp_vs_paper = "USPP ≠ PAW; same XC family (PW91), different operator / transferability"

[pseudopotentials.Ta]
filename = "Ta.pw91-nsp-van.UPF"
url = "https://pseudopotentials.quantum-espresso.org/upf_files/Ta.pw91-nsp-van.UPF"
info_url = "https://pseudopotentials.quantum-espresso.org/info_files/Ta.pw91-nsp-van.txt"
catalog = "https://pseudopotentials.quantum-espresso.org/legacy_tables/original-qe-pp-library/ta"
sha256 = "f9524c97c427e85a65d404b83a564617a485665512baceaef9cf994c1dcdadd7"
functional_tag = "SLA PW GGX GGC"  # PW91 in QE UPF dialect
pseudo_type = "US"
z_valence = 13.0
semicore = true
nlcc = true
relativistic = "scalar"
origin = "Original QE PP library; CAMPOS / Vanderbilt USPP (see info file)"
vanderbilt_code = "7.3.5"

[pseudopotentials.H]
filename = "H.pw91-van_ak.UPF"
url = "https://pseudopotentials.quantum-espresso.org/upf_files/H.pw91-van_ak.UPF"
info_url = "https://pseudopotentials.quantum-espresso.org/info_files/H.pw91-van_ak.txt"
catalog = "https://pseudopotentials.quantum-espresso.org/legacy_tables/original-qe-pp-library/h"
sha256 = "db2198db8ef44114e8e4df895c8fee9b2e74e5afe05e682396d43de308356555"
functional_tag = "SLA PW GGX GGC"
pseudo_type = "US"
z_valence = 1.0
author_note = "Axel Kohlmeyer adapted Vanderbilt set; GGA=PW91"
recommended_ecut_Ry = "20-40 (most optimized near 25)"

[cutoffs]
# Paper ENCUT 250 eV = 250 / 13.605693122 ≈ 18.374 Ry
paper_matched_ecutwfc_Ry = 18.4
paper_matched_ecutrho_Ry = 147.2  # 8 × ecutwfc (USPP density)
pseudo_recommended_ecutwfc_Ry = 25.0
pseudo_recommended_ecutrho_Ry = 200.0

[geometry]
# Identical reconstruction to validation/lineb/tantalum/reconstructed/
n_ta = 16
n_h = 1
a0_A = 3.32
supercell_A = 6.64
kpoints = [3, 3, 3]
